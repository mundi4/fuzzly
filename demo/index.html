<!doctype html>
<html lang="ko">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>fuzzly playground</title>
        <style>
            :root {
                color-scheme: dark;
                --bg: #0e1014;
                --panel: #161a22;
                --panel-2: #1d2230;
                --border: #262c3a;
                --text: #e6e8ef;
                --text-dim: #8b93a7;
                --accent: #7cc4ff;
                --accent-2: #ffd26b;
                --ok: #8fe39b;
                --err: #ff7a8a;
                --hl-bg: #ffd26b;
                --hl-fg: #1a1400;
                --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas,
                    "Liberation Mono", monospace;
            }

            * {
                box-sizing: border-box;
            }

            html,
            body {
                margin: 0;
                padding: 0;
                height: 100%;
                background: var(--bg);
                color: var(--text);
                font-family:
                    -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans KR",
                    sans-serif;
                font-size: 14px;
            }

            body {
                display: flex;
                flex-direction: column;
                height: 100vh;
                overflow: hidden;
            }

            header {
                display: flex;
                align-items: center;
                justify-content: space-between;
                padding: 10px 16px;
                border-bottom: 1px solid var(--border);
                background: var(--panel);
            }

            header .brand {
                font-weight: 600;
                letter-spacing: 0.02em;
            }
            header .brand span {
                color: var(--accent);
            }
            header .hint {
                color: var(--text-dim);
                font-size: 12px;
            }
            header .hint kbd {
                font-family: var(--mono);
                background: var(--panel-2);
                border: 1px solid var(--border);
                border-bottom-width: 2px;
                border-radius: 4px;
                padding: 1px 6px;
                font-size: 11px;
                color: var(--text);
            }

            main {
                flex: 1 1 auto;
                display: grid;
                grid-template-rows: 2fr auto 1fr;
                gap: 10px;
                padding: 12px 16px 14px;
                min-height: 0;
            }

            .section-label {
                display: flex;
                align-items: baseline;
                gap: 8px;
                margin-bottom: 6px;
                color: var(--text-dim);
                font-size: 11px;
                text-transform: uppercase;
                letter-spacing: 0.08em;
            }
            .section-label .count {
                color: var(--text);
                font-family: var(--mono);
                font-size: 11px;
            }

            .target-wrap {
                display: flex;
                flex-direction: column;
                min-height: 0;
            }

            .target-stack {
                position: relative;
                flex: 1 1 auto;
                min-height: 0;
                border: 1px solid var(--border);
                border-radius: 8px;
                background: var(--panel);
                overflow: hidden;
            }

            /* Base positioning for both layers. All typography/padding/
               wrapping props are copied from the textarea at runtime via
               getComputedStyle so metrics match exactly. */
            .target-layer {
                position: absolute;
                inset: 0;
                margin: 0;
                border: 0;
                overflow-y: auto;
                overflow-x: hidden;
                scrollbar-gutter: stable;
            }

            /* highlight div is BEHIND the textarea and renders the actual
               visible text. textarea on top has transparent glyphs but a
               visible caret + selection so the user can still interact. */
            #targetHighlight {
                pointer-events: none;
                user-select: none;
                background: transparent;
                color: var(--text);
            }
            #targetHighlight mark {
                background: var(--hl-bg);
                color: var(--hl-fg);
                border-radius: 2px;
                padding: 0;
                box-decoration-break: clone;
                -webkit-box-decoration-break: clone;
            }

            #targetInput {
                font-family: var(--mono);
                font-size: 14px;
                line-height: 1.55;
                letter-spacing: normal;
                word-spacing: normal;
                tab-size: 4;
                -moz-tab-size: 4;
                padding: 14px 16px;
                white-space: pre-wrap;
                overflow-wrap: break-word;
                word-break: normal;
                background: transparent;
                color: transparent;
                outline: none;
                resize: none;
                caret-color: var(--accent);
            }
            #targetInput::selection {
                background: rgba(124, 196, 255, 0.35);
            }
            #targetInput::-moz-selection {
                background: rgba(124, 196, 255, 0.35);
            }
            #targetInput::placeholder {
                color: var(--text-dim);
            }

            .query-wrap {
                display: flex;
                flex-direction: column;
            }

            .query-row {
                display: flex;
                align-items: center;
                gap: 10px;
                border: 1px solid var(--border);
                border-radius: 8px;
                background: var(--panel);
                padding: 10px 14px;
            }
            .query-row .prompt {
                color: var(--accent);
                font-family: var(--mono);
                font-weight: 700;
                user-select: none;
            }
            #queryInput {
                flex: 1 1 auto;
                background: transparent;
                border: 0;
                outline: none;
                color: var(--text);
                font-family: var(--mono);
                font-size: 16px;
            }
            #queryInput::placeholder {
                color: var(--text-dim);
            }
            .query-row .status {
                font-family: var(--mono);
                font-size: 12px;
                color: var(--text-dim);
                white-space: nowrap;
            }
            .query-row .status.ok {
                color: var(--ok);
            }
            .query-row .status.err {
                color: var(--err);
            }

            .debug-wrap {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 10px;
                min-height: 0;
            }
            .debug-panel {
                border: 1px solid var(--border);
                border-radius: 8px;
                background: var(--panel);
                display: flex;
                flex-direction: column;
                min-height: 0;
            }
            .debug-panel .hdr {
                padding: 8px 12px;
                border-bottom: 1px solid var(--border);
                color: var(--text-dim);
                font-size: 11px;
                text-transform: uppercase;
                letter-spacing: 0.08em;
                display: flex;
                justify-content: space-between;
            }
            .debug-panel .body {
                flex: 1 1 auto;
                overflow: auto;
                padding: 10px 12px;
                font-family: var(--mono);
                font-size: 12px;
                line-height: 1.6;
                white-space: pre-wrap;
                word-break: break-word;
            }
            .atom-pill {
                display: inline-block;
                padding: 1px 6px;
                margin: 0 3px 3px 0;
                border-radius: 4px;
                background: var(--panel-2);
                border: 1px solid var(--border);
            }
            .atom-pill .lead {
                color: var(--accent);
            }
            .atom-pill .vowel {
                color: var(--accent-2);
            }
            .atom-pill .tail {
                color: var(--ok);
            }
            .atom-pill .raw {
                color: var(--text-dim);
                margin-right: 4px;
            }

            /* options drawer */
            .options-toggle {
                position: fixed;
                right: 14px;
                bottom: 14px;
                z-index: 20;
                background: var(--panel-2);
                color: var(--text);
                border: 1px solid var(--border);
                border-radius: 999px;
                padding: 8px 14px;
                font-size: 12px;
                font-family: var(--mono);
                cursor: pointer;
                box-shadow: 0 4px 14px rgba(0, 0, 0, 0.4);
            }
            .options-toggle:hover {
                border-color: var(--accent);
            }

            .options-panel {
                position: fixed;
                right: 14px;
                bottom: 58px;
                z-index: 19;
                width: 280px;
                background: var(--panel);
                border: 1px solid var(--border);
                border-radius: 10px;
                padding: 14px;
                box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
                display: none;
            }
            .options-panel.open {
                display: block;
            }
            .options-panel h3 {
                margin: 0 0 10px;
                font-size: 11px;
                text-transform: uppercase;
                letter-spacing: 0.08em;
                color: var(--text-dim);
            }
            .opt-row {
                display: flex;
                align-items: center;
                justify-content: space-between;
                padding: 6px 0;
            }
            .opt-row label {
                font-size: 13px;
            }
            .opt-row .note {
                display: block;
                color: var(--text-dim);
                font-size: 11px;
                margin-top: 2px;
            }
            .opt-row input[type="checkbox"] {
                width: 18px;
                height: 18px;
                accent-color: var(--accent);
            }

            .banner {
                position: fixed;
                left: 50%;
                top: 50%;
                transform: translate(-50%, -50%);
                background: var(--panel);
                border: 1px solid var(--err);
                border-radius: 10px;
                padding: 18px 22px;
                color: var(--text);
                font-family: var(--mono);
                font-size: 13px;
                max-width: 520px;
                z-index: 100;
                display: none;
            }
            .banner.show {
                display: block;
            }
            .banner code {
                color: var(--accent);
            }
        </style>
    </head>
    <body>
        <header>
            <div class="brand">fuzzly <span>playground</span></div>
            <div class="hint">
                타겟 붙여넣기 · 쿼리 입력 · <kbd>Ctrl</kbd>+<kbd>Del</kbd>
                쿼리 지우기 · <kbd>Esc</kbd> 포커스 전환
            </div>
        </header>

        <main>
            <div class="target-wrap">
                <div class="section-label">
                    TARGET <span class="count" id="targetCount">0 chars</span>
                </div>
                <div class="target-stack">
                    <div class="target-layer" id="targetHighlight"></div>
                    <textarea
                        class="target-layer"
                        id="targetInput"
                        placeholder="여기에 타겟 텍스트를 붙여넣어. 붙여넣은 전체가 하나의 target이야."
                        spellcheck="false"
                    ></textarea>
                </div>
            </div>

            <div class="query-wrap">
                <div class="section-label">
                    QUERY <span class="count" id="queryCount">0</span>
                </div>
                <div class="query-row">
                    <span class="prompt">&gt;</span>
                    <input
                        id="queryInput"
                        type="text"
                        placeholder='초성, 부분 음절, "literal" 모두 OK'
                        spellcheck="false"
                        autocomplete="off"
                        autofocus
                    />
                    <span class="status" id="status">대기</span>
                </div>
            </div>

            <div class="debug-wrap">
                <div class="debug-panel">
                    <div class="hdr">
                        <span>QUERY breakdown</span>
                        <span id="queryMeta"></span>
                    </div>
                    <div class="body" id="queryDebug">—</div>
                </div>
                <div class="debug-panel">
                    <div class="hdr">
                        <span>MATCH info</span>
                        <span id="matchMeta"></span>
                    </div>
                    <div class="body" id="matchDebug">—</div>
                </div>
            </div>
        </main>

        <button class="options-toggle" id="optionsToggle">⚙ options</button>
        <div class="options-panel" id="optionsPanel">
            <h3>match options</h3>
            <div class="opt-row">
                <div>
                    <label for="optCase">case sensitive</label>
                    <span class="note"
                        >query / target / match 세 단계 모두에 적용</span
                    >
                </div>
                <input type="checkbox" id="optCase" />
            </div>
        </div>

        <div class="banner" id="banner">
            <strong id="bannerTitle">로드 실패</strong><br /><br />
            <div id="bannerBody"></div>
        </div>

        <script src="../dist/index.global.js"></script>
        <script>
            const banner = document.getElementById("banner");
            const bannerTitle = document.getElementById("bannerTitle");
            const bannerBody = document.getElementById("bannerBody");

            function showBanner(title, html) {
                bannerTitle.textContent = title;
                bannerBody.innerHTML = html;
                banner.classList.add("show");
            }

            if (typeof fuzzly === "undefined") {
                showBanner(
                    "빌드 결과를 불러오지 못했어",
                    `<code>dist/index.global.js</code> 가 없어.<br /><br />
                    프로젝트 루트에서 <code>npm run build</code> 한 번 돌려줘.`,
                );
                throw new Error("fuzzly global not found");
            }

            const { buildQuery, preprocessTarget, match, buildMatchRanges } =
                fuzzly;

            const targetInput = document.getElementById("targetInput");
            const targetHighlight = document.getElementById("targetHighlight");
            const queryInput = document.getElementById("queryInput");
            const targetCount = document.getElementById("targetCount");
            const queryCount = document.getElementById("queryCount");
            const status = document.getElementById("status");
            const queryDebug = document.getElementById("queryDebug");
            const matchDebug = document.getElementById("matchDebug");
            const queryMeta = document.getElementById("queryMeta");
            const matchMeta = document.getElementById("matchMeta");
            const optCase = document.getElementById("optCase");
            const optionsToggle = document.getElementById("optionsToggle");
            const optionsPanel = document.getElementById("optionsPanel");

            // persistence
            const LS_KEY = "fuzzly.playground.v1";
            try {
                const saved = JSON.parse(localStorage.getItem(LS_KEY) || "{}");
                if (typeof saved.target === "string")
                    targetInput.value = saved.target;
                if (typeof saved.query === "string")
                    queryInput.value = saved.query;
                if (typeof saved.caseSensitive === "boolean")
                    optCase.checked = saved.caseSensitive;
            } catch {}

            function persist() {
                localStorage.setItem(
                    LS_KEY,
                    JSON.stringify({
                        target: targetInput.value,
                        query: queryInput.value,
                        caseSensitive: optCase.checked,
                    }),
                );
            }

            function escapeHtml(s) {
                return s
                    .replace(/&/g, "&amp;")
                    .replace(/</g, "&lt;")
                    .replace(/>/g, "&gt;");
            }

            function renderHighlight(input, ranges) {
                // trailing newline padding: div drops an empty final line that
                // textarea still renders. append a space so wrap math matches.
                const pad = input.endsWith("\n") ? " " : "";
                if (!ranges || ranges.length === 0) {
                    targetHighlight.textContent = input + pad;
                    return;
                }
                // ranges assumed sorted, non-overlapping (buildMatchRanges guarantees)
                let html = "";
                let cursor = 0;
                for (const { start, end } of ranges) {
                    if (start > cursor)
                        html += escapeHtml(input.slice(cursor, start));
                    html +=
                        "<mark>" +
                        escapeHtml(input.slice(start, end)) +
                        "</mark>";
                    cursor = end;
                }
                if (cursor < input.length)
                    html += escapeHtml(input.slice(cursor));
                targetHighlight.innerHTML = html + pad;
            }

            function graphemeBreakdown(qg) {
                // atoms: string; vowelIndex/tailIndex
                const atoms = qg.atoms;
                const { vowelIndex, tailIndex } = qg;
                let out = "";
                for (let i = 0; i < atoms.length; i++) {
                    const cls =
                        tailIndex !== -1 && i >= tailIndex
                            ? "tail"
                            : vowelIndex !== -1 && i >= vowelIndex
                              ? "vowel"
                              : "lead";
                    out += `<span class="${cls}">${escapeHtml(atoms[i])}</span>`;
                }
                return `<span class="atom-pill"><span class="raw">${escapeHtml(qg.char)}</span>${out}</span>`;
            }

            function renderSingleQueryBreakdown(query) {
                if (query.literal !== null) {
                    return (
                        '<span class="atom-pill">' +
                        escapeHtml(JSON.stringify(query.literal)) +
                        "</span>"
                    );
                }
                if (query.graphemes.length === 0) return "—";
                return query.graphemes.map(graphemeBreakdown).join(" ");
            }

            function renderQueryDebug(tokens, queries) {
                if (tokens.length === 0) {
                    queryMeta.textContent = "";
                    queryDebug.textContent = "—";
                    return;
                }
                queryMeta.textContent = `${tokens.length} token(s)`;
                queryDebug.innerHTML = queries
                    .map((q, i) => {
                        return (
                            `<div style="margin-bottom:6px">` +
                            `<span style="color:var(--text-dim)">[${i + 1}]</span> ` +
                            renderSingleQueryBreakdown(q) +
                            `</div>`
                        );
                    })
                    .join("");
            }

            function renderMatchDebug(result, ms) {
                if (result.failed) {
                    matchMeta.textContent = `no match · ${ms.toFixed(2)}ms`;
                    matchDebug.innerHTML = `<span style="color:var(--err)">token [${result.failedAt + 1}] "${escapeHtml(result.failedToken)}" failed</span>`;
                    return;
                }
                const ranges = result.ranges;
                matchMeta.textContent = `${ranges.length} range(s) · ${ms.toFixed(2)}ms`;
                if (ranges.length === 0) {
                    matchDebug.innerHTML =
                        '<span style="color:var(--text-dim)">empty query</span>';
                    return;
                }
                const rangeList = ranges
                    .map((r) => `[${r.start}, ${r.end})`)
                    .join(" ");
                matchDebug.innerHTML = `<div><span style="color:var(--text-dim)">char ranges:</span> ${rangeList}</div>`;
            }

            function runMultiTokenMatch(rawTarget, tokens, queries, caseSensitive) {
                const allRanges = [];
                let charOffset = 0;
                for (let i = 0; i < queries.length; i++) {
                    const subInput = rawTarget.slice(charOffset);
                    const subTarget = preprocessTarget(subInput, { caseSensitive });
                    const hits = match(queries[i], subTarget, { caseSensitive });
                    if (hits === null) {
                        return {
                            failed: true,
                            failedAt: i,
                            failedToken: tokens[i],
                            ranges: [],
                        };
                    }
                    const subRanges = buildMatchRanges([hits], subTarget);
                    for (const r of subRanges) {
                        allRanges.push({
                            start: r.start + charOffset,
                            end: r.end + charOffset,
                        });
                    }
                    if (subRanges.length > 0) {
                        charOffset += subRanges[subRanges.length - 1].end;
                    }
                }
                return { failed: false, ranges: allRanges };
            }

            function recompute() {
                const rawTarget = targetInput.value;
                const rawQuery = queryInput.value;
                const caseSensitive = optCase.checked;

                targetCount.textContent = `${rawTarget.length} chars`;
                queryCount.textContent = `${rawQuery.length} chars`;

                const tokens = rawQuery.split(/\s+/).filter((t) => t.length > 0);
                const queries = tokens.map((t) =>
                    buildQuery(t, { caseSensitive }),
                );
                renderQueryDebug(tokens, queries);

                if (rawTarget.length === 0) {
                    renderHighlight("", []);
                    status.textContent = "타겟 없음";
                    status.className = "status";
                    matchMeta.textContent = "";
                    matchDebug.textContent = "—";
                    persist();
                    return;
                }

                if (tokens.length === 0) {
                    renderHighlight(rawTarget, []);
                    status.textContent = "쿼리 없음";
                    status.className = "status";
                    matchMeta.textContent = "";
                    matchDebug.textContent = "—";
                    persist();
                    return;
                }

                const t0 = performance.now();
                const result = runMultiTokenMatch(
                    rawTarget,
                    tokens,
                    queries,
                    caseSensitive,
                );
                const t1 = performance.now();

                renderHighlight(rawTarget, result.ranges);
                renderMatchDebug(result, t1 - t0);

                if (result.failed) {
                    status.textContent = `no match`;
                    status.className = "status err";
                } else {
                    status.textContent = `match · ${result.ranges.length} range${result.ranges.length === 1 ? "" : "s"}`;
                    status.className = "status ok";
                }
                persist();
            }

            // Copy every text-layout-affecting property from the textarea
            // to the highlight div so line wrap & glyph positions match.
            function syncHighlightStyle() {
                const cs = getComputedStyle(targetInput);
                const props = [
                    "fontFamily",
                    "fontSize",
                    "fontWeight",
                    "fontStyle",
                    "fontVariant",
                    "fontStretch",
                    "lineHeight",
                    "letterSpacing",
                    "wordSpacing",
                    "textTransform",
                    "textIndent",
                    "textAlign",
                    "tabSize",
                    "whiteSpace",
                    "overflowWrap",
                    "wordBreak",
                    "wordWrap",
                    "paddingTop",
                    "paddingRight",
                    "paddingBottom",
                    "paddingLeft",
                    "boxSizing",
                    "direction",
                ];
                for (const p of props) {
                    targetHighlight.style[p] = cs[p];
                }
            }
            syncHighlightStyle();
            window.addEventListener("resize", syncHighlightStyle);

            // keep highlight scroll synced to textarea
            targetInput.addEventListener("scroll", () => {
                targetHighlight.scrollTop = targetInput.scrollTop;
                targetHighlight.scrollLeft = targetInput.scrollLeft;
            });

            targetInput.addEventListener("input", recompute);
            queryInput.addEventListener("input", recompute);
            optCase.addEventListener("change", recompute);

            // Ctrl+Del clears query
            queryInput.addEventListener("keydown", (e) => {
                if (e.ctrlKey && e.key === "Delete") {
                    e.preventDefault();
                    queryInput.value = "";
                    recompute();
                }
            });

            // Esc toggles focus between query and target
            document.addEventListener("keydown", (e) => {
                if (e.key === "Escape") {
                    if (document.activeElement === queryInput) {
                        targetInput.focus();
                    } else {
                        queryInput.focus();
                    }
                }
            });

            // options drawer
            optionsToggle.addEventListener("click", () => {
                optionsPanel.classList.toggle("open");
            });
            document.addEventListener("click", (e) => {
                if (
                    !optionsPanel.contains(e.target) &&
                    e.target !== optionsToggle
                ) {
                    optionsPanel.classList.remove("open");
                }
            });

            recompute();
            queryInput.focus();
        </script>
    </body>
</html>
