<!doctype html>
<html lang="ko">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>fuzzly playground</title>
        <link rel="stylesheet" href="./playground.css" />
    </head>
    <body>
        <header>
            <div class="brand">fuzzly <span>playground</span></div>
            <div class="hint">
                타겟 붙여넣기 · 쿼리 입력 ·
                <kbd>Ctrl</kbd>+<kbd>Del</kbd> 쿼리 지우기 ·
                <kbd>Esc</kbd> 포커스 전환 ·
                <a href="./ime-inspector.html">ime inspector</a>
            </div>
        </header>

        <main>
            <div class="top-row">
                <div class="target-wrap">
                    <div class="section-label">
                        TARGET <span class="count" id="targetCount">0 chars</span>
                    </div>
                    <div class="target-stack">
                        <div class="target-layer" id="targetHighlight"></div>
                        <textarea
                            class="target-layer"
                            id="targetInput"
                            placeholder="여기에 타겟 텍스트를 붙여넣어. 붙여넣은 전체가 하나의 target이야."
                            spellcheck="false"
                        ></textarea>
                    </div>
                </div>
                <div class="options-wrap">
                    <div class="section-label">OPTIONS</div>
                    <div class="debug-panel">
                        <div class="body">
                            <div class="opt-row">
                                <label for="optStrict">strict</label>
                                <input type="checkbox" id="optStrict" />
                            </div>
                            <div class="opt-row">
                                <label for="optWhitespace">whitespace</label>
                                <select id="optWhitespace">
                                    <option value="literal">literal</option>
                                    <option value="ignore">ignore</option>
                                </select>
                            </div>

                            <div class="opt-section">scoring weights <button type="button" class="opt-reset" id="optScoreReset" title="reset to defaults">reset</button></div>
                            <div class="opt-row"><label for="wAnchorFill">anchorFill</label><input type="number" id="wAnchorFill" step="10" /></div>
                            <div class="opt-row"><label for="wPositionZero">positionZero</label><input type="number" id="wPositionZero" step="10" /></div>
                            <div class="opt-row"><label for="wBoundary">boundary</label><input type="number" id="wBoundary" step="10" /></div>
                            <div class="opt-row"><label for="wConsecutive">consecutive</label><input type="number" id="wConsecutive" step="5" /></div>
                            <div class="opt-row"><label for="wGapPenalty">gapPenalty</label><input type="number" id="wGapPenalty" step="1" /></div>
                            <div class="opt-row"><label for="wTargetLengthPenalty">targetLengthPenalty</label><input type="number" id="wTargetLengthPenalty" step="1" /></div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="query-wrap">
                <div class="section-label">
                    QUERY <span class="count" id="queryCount">0</span>
                </div>
                <div class="query-row">
                    <span class="prompt">&gt;</span>
                    <input
                        id="queryInput"
                        type="text"
                        placeholder="한글 IME로 타이핑해봐."
                        spellcheck="false"
                        autocomplete="off"
                        autofocus
                    />
                    <span class="status" id="status">대기</span>
                </div>
            </div>

            <div class="debug-wrap">
                <div class="debug-panel">
                    <div class="hdr">
                        <span>QUERY breakdown</span>
                        <span id="queryMeta"></span>
                    </div>
                    <div class="body" id="queryDebug">—</div>
                </div>
                <div class="debug-panel">
                    <div class="hdr">
                        <span>MATCH info</span>
                        <span id="matchMeta"></span>
                    </div>
                    <div class="body" id="matchDebug">—</div>
                </div>
            </div>
        </main>

        <script type="module" src="./main.ts"></script>
    </body>
</html>
